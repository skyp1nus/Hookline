name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer PR push supersedes the older run; main runs always finish (each one deploys).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  backend:
    name: Backend (build + arch/unit tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Hookline.slnx
      - run: dotnet build Hookline.slnx -c Release --no-restore
      # The architecture tests run here — an illegal module reference fails this step
      # (non-zero exit), which fails the job and blocks the merge.
      - name: Test (gates the build on architecture violations)
        run: dotnet test Hookline.slnx -c Release --no-build --verbosity normal

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"   # same as the oven/bun tag in web/Dockerfile
      - run: bun install --frozen-lockfile
      - run: bun run build

  changes:
    name: Image inputs changed?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            images:
              - '.github/workflows/ci.yml'
              - 'backend/*.slnx'
              - 'backend/*.props'
              - 'backend/global.json'
              - 'backend/**/*.csproj'
              - 'backend/.dockerignore'
              - 'backend/Dockerfile'
              - 'web/package.json'
              - 'web/bun.lock'
              - 'web/next.config.ts'
              - 'web/.dockerignore'
              - 'web/Dockerfile'

  # Runs alongside the build gates, not after them; deploy waits for both.
  # On a PR it only proves the image still builds, and only when its inputs moved.
  images:
    name: Image (${{ matrix.name }})
    needs: [changes]
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
       needs.changes.outputs.images == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            build-args: ""
          - name: frontend
            context: ./web
            file: ./web/Dockerfile
            # Inlined into the client bundle at build time ("Connect Slack/Google" redirects),
            # so it must be the public origin — a runtime env cannot override it.
            build-args: |
              NEXT_PUBLIC_BACKEND_URL=https://hookline.danielhub.dev
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build (+ push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          provenance: false
          build-args: ${{ matrix.build-args }}
          # Only the sha tag here; :latest moves after a successful deploy.
          tags: ghcr.io/skyp1nus/hookline/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # Only main writes the cache — a PR's cache is invisible to main anyway.
          cache-to: ${{ env.PUSH == 'true' && format('type=gha,scope={0},mode=max,ignore-error=true', matrix.name) || '' }}

  # Requires repo secrets DEPLOY_HOST, DEPLOY_SSH_KEY, TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET.
  deploy:
    name: Deploy (copy deploy/, pull, up --wait, reload Caddy)
    needs: [backend, frontend, images]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.images.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Queue, never cancel: a half-finished deploy is worse than a late one. deploy.sh also locks the host.
    concurrency:
      group: prod-deploy-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read   # GITHUB_TOKEN can then pull this repo's private GHCR images on the server
    steps:
      - uses: actions/checkout@v7
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Resolve deploy host on the tailnet
        id: host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ip=$(tailscale ip -4 "$DEPLOY_HOST" 2>/dev/null || getent ahostsv4 "$DEPLOY_HOST" | awk 'NR==1 {print $1}')
          [ -n "$ip" ] || { echo "::error::DEPLOY_HOST does not resolve on the tailnet"; exit 1; }
          timeout 15 bash -c "</dev/tcp/$ip/22" || { echo "::error::$ip:22 is unreachable over the tailnet (ACL?)"; exit 1; }
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
      # Plain OpenSSH, one multiplexed connection. Host keys aren't pinned (neither were they with
      # appleboy); the peer is already authenticated by WireGuard.
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_IP: ${{ steps.host.outputs.ip }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName $HOST_IP
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 120
          EOF
      - name: Copy compose, Caddy snippet, deploy script
        run: tar -czf - -C deploy docker-compose.prod.yml Caddyfile deploy.sh | ssh prod 'tar -xzf - -C /opt/hookline'
      - name: Pull, restart, wait for health, reload Caddy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029 # sha and actor are meant to expand here
          printf '%s' "$GHCR_TOKEN" | ssh prod "IMAGE_TAG='$GITHUB_SHA' GHCR_USER='$GITHUB_ACTOR' bash /opt/hookline/deploy.sh"

  # :latest only ever points at what prod runs, so a manual `compose up` without IMAGE_TAG is safe.
  latest:
    name: Tag deployed images as latest
    needs: [deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for img in backend frontend; do
            docker buildx imagetools create --prefer-index=false \
              -t "ghcr.io/skyp1nus/hookline/$img:latest" "ghcr.io/skyp1nus/hookline/$img:$GITHUB_SHA"
          done
